services:
  frontend-st:
    build: ./src/frontend-st
    ports:
      - "8501:8501"
    volumes:
      - ./src/frontend-st:/app
      - /app/.venv # excluding possible .venv mount from host
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
        restart: true
  mentor:
    build: ./src/frontend-st # same image, a different entry file
    command:
      - streamlit
      - run
      - mentor.py
      - --server.port=8502
      - --server.address=0.0.0.0
    ports:
      - "8502:8502"
    volumes:
      - ./src/frontend-st:/app
      - /app/.venv # excluding possible .venv mount from host
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

  backend:
    build: ./src/backend
    ports:
      - "5000:5000"
    volumes:
      - ./src/backend:/app
      - /app/.venv # excluding possible .venv mount from host
      - ./data/documents:/data/documents
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      # - frontend
  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  pgdata:
