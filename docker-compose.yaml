services:
  frontend-st:
    build: ./src/frontend-st
    ports:
      - "8501:8501"
    volumes:
      - ./src/frontend-st:/app
      - /app/.venv # excluding possible .venv mount from host
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
        restart: true
  mentor:
    build: ./src/frontend-st # same image, a different entry file
    command:
      - streamlit
      - run
      - mentor.py
      - --server.port=8502
      - --server.address=0.0.0.0
    ports:
      - "8502:8502"
    volumes:
      - ./src/frontend-st:/app
      - /app/.venv # excluding possible .venv mount from host
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

  backend:
    build: ./src/backend
    ports:
      - "5000:5000"
    volumes:
      - ./src/backend:/app
      - /app/.venv # excluding possible .venv mount from host
      - ./data/documents:/data/documents
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      # - frontend
  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:?}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?}
      - PGADMIN_SERVER_JSON_FILE=/var/lib/pgadmin/servers.json
      - PGADMIN_REPLACE_SERVERS_ON_STARTUP=True
      - PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED=False
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_DB=${POSTGRES_DB:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s/__POSTGRES_USER__/$$POSTGRES_USER/" \
            -e "s/__POSTGRES_DB__/$$POSTGRES_DB/" \
            /servers.template.json > /var/lib/pgadmin/servers.json
        exec /entrypoint.sh
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./db/pgadmin/servers.template.json:/servers.template.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
